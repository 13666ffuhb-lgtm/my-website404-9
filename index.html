<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Oops! Page Not Found</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            slateBg: '#3b4157',
            beamYellow: '#f0ce40',
            beamPool: '#f4e6a3',
            cowBrown: '#6d5c56',
            cowPink: '#f3a4ae',
          },
        },
      },
    };
  </script>
  <style>
    /* Ensure full-screen layout without clipping or scrollbars */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #3b4157;
    }

    @keyframes spotlightPulse {
      0% {
        opacity: 1;
      }
      45% {
        opacity: 0.84;
      }
      100% {
        opacity: 1;
      }
    }

    .spotlight-pulse {
      animation: spotlightPulse 0.65s ease-out;
    }
  </style>
</head>
<body class="bg-slateBg text-white font-sans w-screen h-screen overflow-hidden select-none relative">
  <!-- Main Scene Container -->
  <div id="sceneContainer" class="relative w-full h-full flex items-center">
    <!-- Full-Viewport Vector Spotlight Layer -->
    <svg
      id="spotlightSvg"
      class="absolute inset-0 w-full h-full pointer-events-none"
      aria-hidden="true"
    >
      <g id="spotlightGroup">
        <!-- Tall Golden Spotlight Beam extending from top edge to bottom pool -->
        <polygon id="spotlightBeam" fill="#f0ce40" />
        <!-- Oval Light Pool near the bottom -->
        <ellipse id="spotlightPool" fill="#f4e6a3" />
      </g>
    </svg>

    <!-- Left-Aligned 404 Typography & Retry Control -->
    <main class="relative z-10 w-full max-w-6xl mx-auto px-7 sm:px-14 md:px-20 pointer-events-none">
      <div class="w-full md:w-1/2 flex flex-col items-start text-left pointer-events-auto">
        <h1 class="text-6xl sm:text-7xl md:text-[5.5rem] font-extrabold tracking-tight leading-none text-white">
          404
        </h1>

        <p class="mt-3 sm:mt-4 text-xl sm:text-2xl md:text-[1.65rem] font-semibold tracking-tight text-white">
          oops! page not found
        </p>

        <p class="mt-2 text-xs sm:text-sm font-normal text-white/75 max-w-xs sm:max-w-sm leading-relaxed">
          Perhaps you can try to refresh the page, sometimes it works
        </p>

        <div class="mt-6 flex flex-wrap items-center gap-3">
          <button
            id="retryButton"
            type="button"
            class="px-7 py-2.5 rounded-full bg-beamYellow text-white font-bold text-xs sm:text-sm tracking-wider uppercase shadow-sm hover:bg-[#f5d756] active:scale-95 transition-all duration-150 cursor-pointer focus:outline-none focus:ring-2 focus:ring-beamPool"
          >
            RETRY
          </button>

          <span
            id="retryFeedback"
            role="status"
            aria-live="polite"
            class="text-xs text-beamPool font-medium opacity-0 transition-opacity duration-300"
          ></span>
        </div>
      </div>
    </main>

    <!-- Floating Flat-Vector Cow Positioned Inside the Beam -->
    <div
      id="cowWrapper"
      class="absolute z-20 cursor-pointer touch-none"
      style="left: 0px; top: 0px; transform: translate(-50%, -50%);"
    >
      <svg
        id="cowSvg"
        width="140"
        height="116"
        viewBox="-64 -44 128 96"
        class="w-28 h-24 sm:w-32 sm:h-28 md:w-36 md:h-30 overflow-visible drop-shadow-[0_6px_12px_rgba(35,39,54,0.16)]"
        role="img"
        aria-label="Flat-vector white and brown cow floating in spotlight"
      >
        <!-- Pivot group centered around cow body for clean rotation -->
        <g id="cowTransformGroup" transform="rotate(-12)">
          <!-- Back Legs -->
          <rect x="-24" y="10" width="7.5" height="21" rx="1.5" fill="#e6e2da" />
          <rect x="11" y="8" width="7.5" height="20" rx="1.5" fill="#e6e2da" />

          <!-- Udder -->
          <path d="M-8 10 C-8 17, 5 17, 5 10 Z" fill="#f3a4ae" />

          <!-- Torso -->
          <path
            d="M-33 -15 L15 -20 C19 -20.5 22 -18 23 -14 L27 3 C28 7 25 10 21 11 L-27 16 C-31 16.5 -34 14 -35 10 L-37 -8 C-37.5 -12 -35.5 -14.5 -33 -15 Z"
            fill="#ffffff"
          />

          <!-- Brown Spots -->
          <path
            d="M-16 -16 C-10 -17 -5 -13 -4 -6 C-3 0 -9 6 -15 6 C-21 6 -24 0 -23 -7 C-22 -12 -19 -15 -16 -16 Z"
            fill="#6d5c56"
          />
          <path
            d="M4 -18 C10 -19 16 -17 18 -12 C20 -8 16 -3 10 -3 C4 -3 0 -7 0 -12 C0 -15 1 -17 4 -18 Z"
            fill="#6d5c56"
          />

          <!-- Front Legs -->
          <rect x="-29" y="12" width="8" height="22" rx="1.5" fill="#ffffff" />
          <rect x="5" y="10" width="8" height="21" rx="1.5" fill="#ffffff" />

          <!-- Horns -->
          <path d="M-37 -11 L-47 -16 C-45 -11 -41 -8 -36 -7 Z" fill="#ffffff" />

          <!-- Head -->
          <path
            d="M-35 -15 L-47 -12 C-51 -11 -52 -6 -51 -1 L-49 6 C-48 10 -44 12 -40 11 L-31 9 Z"
            fill="#6d5c56"
          />

          <!-- White Face Patch -->
          <path
            d="M-38 -13 C-35 -11 -34 -5 -36 0 C-38 2 -41 1 -42 -2 C-43 -7 -41 -11 -38 -13 Z"
            fill="#ffffff"
          />

          <!-- Ear -->
          <ellipse
            cx="-34"
            cy="-14"
            rx="4.6"
            ry="2.2"
            transform="rotate(-24 -34 -14)"
            fill="#6d5c56"
          />

          <!-- Tail -->
          <path
            d="M24 -9 Q35 -11 34 1"
            fill="none"
            stroke="#ffffff"
            stroke-width="2.4"
            stroke-linecap="round"
          />
          <ellipse
            cx="34"
            cy="3"
            rx="2.4"
            ry="3.6"
            transform="rotate(12 34 3)"
            fill="#6d5c56"
          />
        </g>
      </svg>
    </div>
  </div>

  <script>
    (function () {
      const spotlightBeam = document.getElementById('spotlightBeam');
      const spotlightPool = document.getElementById('spotlightPool');
      const spotlightGroup = document.getElementById('spotlightGroup');
      const cowWrapper = document.getElementById('cowWrapper');
      const cowTransformGroup = document.getElementById('cowTransformGroup');
      const retryButton = document.getElementById('retryButton');
      const retryFeedback = document.getElementById('retryFeedback');

      // Scene anchor metrics updated on resize
      const sceneMetrics = {
        width: window.innerWidth,
        height: window.innerHeight,
        beamCenterX: window.innerWidth * 0.675,
        beamTopHalfWidth: 68,
        beamBottomHalfWidth: 145,
        poolY: window.innerHeight * 0.84,
        cowBaseX: window.innerWidth * 0.675,
        cowBaseY: window.innerHeight * 0.56,
        floatAmplitude: 28,
      };

      // Pointer position in viewport coordinates
      const pointer = {
        x: -9999,
        y: -9999,
        active: false,
      };

      // Damped spring state for gentle sideways shift, slight vertical cushion, and tilt
      const spring = {
        x: 0,
        vx: 0,
        y: 0,
        vy: 0,
        tilt: 0,
        vtilt: 0,
      };

      let retryCount = 0;
      let feedbackTimeout = null;

      function showFeedback(text) {
        if (!retryFeedback) return;
        retryFeedback.textContent = text;
        retryFeedback.classList.remove('opacity-0');
        retryFeedback.classList.add('opacity-100');

        if (feedbackTimeout) {
          clearTimeout(feedbackTimeout);
        }
        feedbackTimeout = setTimeout(() => {
          retryFeedback.classList.remove('opacity-100');
          retryFeedback.classList.add('opacity-0');
        }, 2200);
      }

      // Compute spotlight beam & oval pool geometry cleanly for any screen dimensions
      function updateSceneGeometry() {
        const w = Math.max(320, window.innerWidth);
        const h = Math.max(320, window.innerHeight);
        const isNarrow = w < 768;

        const centerX = isNarrow ? w * 0.52 : w * 0.675;
        const topHalfW = isNarrow ? Math.max(42, w * 0.105) : Math.max(60, Math.min(82, w * 0.068));
        const bottomHalfW = isNarrow ? Math.max(95, w * 0.23) : Math.max(125, Math.min(175, w * 0.145));
        const poolY = h * 0.84;
        const poolRy = Math.max(22, Math.min(52, h * 0.056));

        sceneMetrics.width = w;
        sceneMetrics.height = h;
        sceneMetrics.beamCenterX = centerX;
        sceneMetrics.beamTopHalfWidth = topHalfW;
        sceneMetrics.beamBottomHalfWidth = bottomHalfW;
        sceneMetrics.poolY = poolY;
        sceneMetrics.cowBaseX = centerX - (isNarrow ? 0 : Math.min(20, w * 0.015));
        sceneMetrics.cowBaseY = Math.min(poolY - 120, Math.max(150, h * 0.56));
        sceneMetrics.floatAmplitude = Math.max(16, Math.min(34, h * 0.036));

        if (spotlightBeam && spotlightPool) {
          const x1 = (centerX - topHalfW).toFixed(1);
          const x2 = (centerX + topHalfW).toFixed(1);
          const x3 = (centerX + bottomHalfW).toFixed(1);
          const x4 = (centerX - bottomHalfW).toFixed(1);
          const yBottom = poolY.toFixed(1);

          spotlightBeam.setAttribute('points', `${x1},0 ${x2},0 ${x3},${yBottom} ${x4},${yBottom}`);
          spotlightPool.setAttribute('cx', centerX.toFixed(1));
          spotlightPool.setAttribute('cy', poolY.toFixed(1));
          spotlightPool.setAttribute('rx', bottomHalfW.toFixed(1));
          spotlightPool.setAttribute('ry', poolRy.toFixed(1));
        }
      }

      // Interpolate half-width of the spotlight beam at a given vertical coordinate Y
      function getBeamHalfWidthAtY(y) {
        const ratio = Math.max(0, Math.min(1, y / Math.max(1, sceneMetrics.poolY)));
        return (
          sceneMetrics.beamTopHalfWidth +
          (sceneMetrics.beamBottomHalfWidth - sceneMetrics.beamTopHalfWidth) * ratio
        );
      }

      // Pointer tracking listeners
      window.addEventListener(
        'pointermove',
        (event) => {
          pointer.x = event.clientX;
          pointer.y = event.clientY;
          pointer.active = true;
        },
        { passive: true }
      );

      window.addEventListener(
        'pointerdown',
        (event) => {
          pointer.x = event.clientX;
          pointer.y = event.clientY;
          pointer.active = true;
        },
        { passive: true }
      );

      window.addEventListener('pointerleave', () => {
        pointer.active = false;
      });

      window.addEventListener('resize', updateSceneGeometry);

      if (retryButton) {
        retryButton.addEventListener('click', () => {
          try {
            retryCount += 1;
            if (spotlightGroup) {
              spotlightGroup.classList.remove('spotlight-pulse');
              void spotlightGroup.offsetWidth;
              spotlightGroup.classList.add('spotlight-pulse');
            }

            // Gentle playful upward nudge within safe beam bounds
            spring.vy -= 75;
            spring.vtilt += retryCount % 2 === 0 ? 45 : -45;
            showFeedback(`Checked (${retryCount}): page still not found`);
          } catch (_err) {
            showFeedback('Unable to retry right now');
          }
        });
      }

      updateSceneGeometry();

      let previousTime = performance.now();
      const startTime = previousTime;

      function stepAnimation(now) {
        const dt = Math.min(0.05, Math.max(0.001, (now - previousTime) / 1000));
        previousTime = now;
        const elapsed = (now - startTime) / 1000;

        // Smooth continuous up-and-down motion inside the spotlight beam
        const floatOffsetY = Math.sin(elapsed * 2.15) * sceneMetrics.floatAmplitude;
        const baseTilt = -12 + Math.sin(elapsed * 2.15 + 0.5) * 3;

        const nominalX = sceneMetrics.cowBaseX;
        const nominalY = sceneMetrics.cowBaseY + floatOffsetY;

        // Gentle, predictable mouse interaction: slight sideways shift + subtle tilt
        let targetOffsetX = 0;
        let targetOffsetY = 0;
        let targetTilt = 0;

        if (pointer.active) {
          const currentX = nominalX + spring.x;
          const currentY = nominalY + spring.y;
          const dx = currentX - pointer.x;
          const dy = currentY - pointer.y;
          const distance = Math.hypot(dx, dy);
          const radius = 150;

          if (distance < radius) {
            const proximity = 1 - distance / radius;
            const eased = proximity * proximity;
            const directionX = dx >= 0 ? 1 : -1;
            const directionY = dy >= 0 ? 1 : -1;

            // Gentle sideways drift and subtle vertical cushion
            targetOffsetX = directionX * 26 * eased;
            targetOffsetY = directionY * 10 * eased;
            targetTilt = -directionX * 11 * eased;
          }
        }

        // Critically damped spring integration for smooth return without oscillation
        const stiffness = 64;
        const damping = 16;

        const ax = (targetOffsetX - spring.x) * stiffness - spring.vx * damping;
        const ay = (targetOffsetY - spring.y) * stiffness - spring.vy * damping;
        const atilt = (targetTilt - spring.tilt) * stiffness - spring.vtilt * damping;

        spring.vx += ax * dt;
        spring.vy += ay * dt;
        spring.vtilt += atilt * dt;

        spring.x += spring.vx * dt;
        spring.y += spring.vy * dt;
        spring.tilt += spring.vtilt * dt;

        // Keep cow comfortably inside the spotlight beam width at her current height
        const finalY = Math.max(
          90,
          Math.min(sceneMetrics.poolY - 56, nominalY + spring.y)
        );
        const beamHalfW = getBeamHalfWidthAtY(finalY);
        const maxSideInsideBeam = Math.max(12, beamHalfW - 38);
        const desiredX = nominalX + spring.x;
        const clampedX = Math.max(
          sceneMetrics.beamCenterX - maxSideInsideBeam,
          Math.min(sceneMetrics.beamCenterX + maxSideInsideBeam, desiredX)
        );

        // If clamped against beam boundary, absorb outward velocity cleanly
        if (clampedX !== desiredX) {
          spring.x = clampedX - nominalX;
          spring.vx = 0;
        }

        if (cowWrapper) {
          cowWrapper.style.left = `${clampedX.toFixed(1)}px`;
          cowWrapper.style.top = `${finalY.toFixed(1)}px`;
        }

        if (cowTransformGroup) {
          const finalTilt = Math.max(-28, Math.min(6, baseTilt + spring.tilt));
          cowTransformGroup.setAttribute('transform', `rotate(${finalTilt.toFixed(2)})`);
        }

        requestAnimationFrame(stepAnimation);
      }

      requestAnimationFrame(stepAnimation);
    })();
  </script>
</body>
</html>
